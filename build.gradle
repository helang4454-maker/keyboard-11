plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.glasstype.keyboard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.glasstype.keyboard'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    kotlinOptions { jvmTarget = '17' }
}
